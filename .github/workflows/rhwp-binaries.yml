name: rhwp binaries

# hwp-master 가 쓰는 rhwp CLI 를 공개 upstream(edwardkim/rhwp) 의 커밋에서 빌드해
# 이 저장소의 Release 에 붙인다. 네트워크·시스템 비용을 줄이려고, AI 에이전트가 수 GB 인 rhwp 저장소를 받아 빌드하지 않고
# 플랫폼별 바이너리만 받아 쓰게 하려는 것이다. 문서 읽기·쓰기·편집·추출이 목적이라 native-skia(PNG 렌더)는 넣지 않는다.
# 그래서 Linux 에 fontconfig·freetype 런타임 의존성이 없고 오래된 glibc 에서도 빌드된다.
# 빌드는 --locked release, 패키지 뒤 텍스트·표·개요·데이터 추출·PDF·HWPX 저장을 돌려 검증한다.
#
#   gh workflow run rhwp-binaries.yml                        # devel 최신 커밋
#   gh workflow run rhwp-binaries.yml -f rhwp_ref=<브랜치 또는 40자 커밋 SHA>
#
# 브랜치를 주면 resolve 작업이 그 시점의 커밋 SHA 하나로 고정해 모든 플랫폼이 같은 커밋을 빌드한다.
# 같은 커밋의 Release 가 이미 있으면 빌드하지 않고 반영(update 작업)만 본다.
#
# 매일 한 번 예약 실행으로 devel 최신 커밋을 확인한다. 새 커밋이면 빌드·Release 뒤 update 작업이
# tools/update_rhwp_release.py 로 rhwp_release.json·README 를 맞추고, 새 바이너리를 설치해 전체 테스트와
# tools/eval_extract.py 를 돌린 다음, 통과하면 devel 에 커밋해 main 으로 PR 을 열고 머지한다.
# devel 이 main 과 다르면(진행 중인 작업이 있으면) 그 작업이 함께 머지되지 않게 main 에서 딴
# auto/rhwp-<커밋> 브랜치로 PR 을 올린다. 테스트가 실패하면 커밋·PR 없이 실패로 끝난다.
# macOS 러너를 잡지 못해 작업이 취소되면 rhwp-binaries-retry.yml 이 그 작업만 다시 돌린다.
# 저장소 설정 "Allow GitHub Actions to create and approve pull requests" 가 켜져 있어야 한다.
#
# Release 태그는 rhwp-<rhwp 버전>-<커밋 7자리> 이다. hwp-master 자체 버전 태그(v*)와 섞지 않는다.

on:
  schedule:
    - cron: '17 21 * * *'   # 매일 06:17 KST
  workflow_dispatch:
    inputs:
      rhwp_ref:
        description: 'edwardkim/rhwp 브랜치 또는 커밋 SHA (40자)'
        required: true
        default: devel
      publish:
        description: 'Release 를 만들어 붙인다 (false 면 artifact 만)'
        type: boolean
        default: true
      update:
        description: 'Release 뒤 rhwp_release.json·README 를 맞추고 테스트가 통과하면 main 에 PR·머지한다'
        type: boolean
        default: true

permissions:
  contents: read

# 예약 실행과 수동 실행이 겹쳐 같은 커밋을 두 번 빌드하거나 PR 을 두 번 올리지 않게 한다.
concurrency:
  group: rhwp-binaries
  cancel-in-progress: false

jobs:
  resolve:
    name: Resolve rhwp commit
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.sha.outputs.sha }}
      existing_tag: ${{ steps.sha.outputs.existing_tag }}
    steps:
      - name: Resolve ref to commit SHA
        id: sha
        shell: bash
        env:
          REF: ${{ inputs.rhwp_ref || 'devel' }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$REF" =~ ^[0-9a-f]{40}$ ]]; then
            sha="$REF"
          elif [[ "$REF" =~ ^[A-Za-z0-9._/-]+$ ]]; then
            sha=$(git ls-remote https://github.com/edwardkim/rhwp.git "refs/heads/$REF" | cut -f1)
          fi
          if [[ ! "${sha:-}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "rhwp_ref 를 커밋으로 바꾸지 못했습니다: $REF" >&2
            exit 1
          fi
          echo "rhwp $REF -> $sha"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "### rhwp \`$REF\` → \`$sha\`" >> "$GITHUB_STEP_SUMMARY"
          existing=$(gh release list --repo "${{ github.repository }}" --limit 100 --json tagName --jq '.[].tagName' \
            | grep -E -- "^rhwp-[0-9]+\.[0-9]+\.[0-9]+-${sha:0:7}$" | head -1 || true)
          if [[ -n "$existing" ]]; then
            echo "::notice::이 커밋(${sha:0:7})의 Release 가 이미 있습니다: $existing — 빌드하지 않습니다."
            echo "Release \`$existing\` 가 이미 있어 빌드하지 않았습니다." >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "existing_tag=$existing" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.suffix }}
    needs: resolve
    if: needs.resolve.outputs.existing_tag == ''
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-15
            suffix: macos-aarch64
            archive: tar.gz
            binary: rhwp
          - target: x86_64-apple-darwin
            runner: macos-15-intel
            suffix: macos-x86_64
            archive: tar.gz
            binary: rhwp
          # Linux 바이너리는 빌드한 시스템의 glibc 이상에서만 돈다. 오래된 배포판(RHEL 8·Debian 10·Ubuntu 20.04)용은
          # manylinux_2_28 컨테이너(AlmaLinux 8, glibc 2.28) 안에서 빌드·검증한다.
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-22.04
            suffix: linux-x86_64-glibc2.28
            archive: tar.gz
            binary: rhwp
            glibc: '2.28'
            docker: quay.io/pypa/manylinux_2_28_x86_64
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-22.04
            suffix: linux-x86_64-glibc2.35
            archive: tar.gz
            binary: rhwp
            glibc: '2.35'
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
            suffix: windows-x86_64
            archive: zip
            binary: rhwp.exe
    outputs:
      version: ${{ steps.meta.outputs.version }}
      short: ${{ steps.meta.outputs.short }}

    steps:
      # rhwp 작업 트리(샘플·문서 포함 약 0.6GB)와 release 빌드가 Linux 러너 기본 여유 공간을 넘길 수 있다
      # (첫 실행에서 checkout 중 No space left on device). 쓰지 않는 도구를 지워 공간을 만든다.
      - name: Free disk space (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /usr/share/swift /usr/local/share/boost
          sudo docker image prune --all --force >/dev/null 2>&1 || true
          df -h /

      - name: Checkout rhwp
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: edwardkim/rhwp
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false
          fetch-depth: 1
          lfs: false

      - name: Read version
        id: meta
        shell: bash
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          short=$(git rev-parse --short=7 HEAD)
          test "$(git rev-parse HEAD)" = "${{ needs.resolve.outputs.sha }}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "short=$short" >> "$GITHUB_OUTPUT"
          echo "ARCHIVE=rhwp-$version-$short-${{ matrix.suffix }}.${{ matrix.archive }}" >> "$GITHUB_ENV"

      - name: Install Rust toolchain
        if: ${{ !matrix.docker }}
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable (2026-08-01)
        with:
          targets: ${{ matrix.target }}

      - name: Build
        if: ${{ !matrix.docker }}
        shell: bash
        run: cargo build --locked --release --bin rhwp --target ${{ matrix.target }}

      - name: Build in container
        if: ${{ matrix.docker }}
        shell: bash
        run: |
          docker run --rm -v "$PWD":/src -w /src -e CARGO_HOME=/src/.ci-cargo -e RUSTUP_HOME=/src/.ci-rustup \
            -e TARGET="${{ matrix.target }}" "${{ matrix.docker }}" bash -euo pipefail -c '
              curl --proto "=https" --tlsv1.2 -sSf https://sh.rustup.rs \
                | sh -s -- -y -q --profile minimal --default-toolchain stable --target "$TARGET"
              . "$CARGO_HOME/env"
              rustc --version
              ldd --version | sed -n 1p
              cargo build --locked --release --bin rhwp --target "$TARGET"
            '
          sudo chown -R "$(id -u):$(id -g)" target

      - name: Check required glibc (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          bin="target/${{ matrix.target }}/release/${{ matrix.binary }}"
          need=$(objdump -T "$bin" | grep -o 'GLIBC_[0-9][0-9.]*' | sed 's/GLIBC_//' | sort -uV | tail -1)
          echo "필요한 glibc: $need (허용 ${{ matrix.glibc }})"
          echo "### ${{ matrix.suffix }}: 필요한 glibc $need" >> "$GITHUB_STEP_SUMMARY"
          test "$(printf '%s\n%s\n' "$need" "${{ matrix.glibc }}" | sort -V | tail -1)" = "${{ matrix.glibc }}"
          echo "동적 라이브러리:"; objdump -p "$bin" | grep NEEDED

      - name: Package
        shell: bash
        run: |
          mkdir -p dist/rhwp
          cp "target/${{ matrix.target }}/release/${{ matrix.binary }}" dist/rhwp/
          cp LICENSE dist/rhwp/LICENSE
          cat > dist/rhwp/BUILD_INFO.txt <<EOF
          rhwp ${{ steps.meta.outputs.version }}
          source: https://github.com/edwardkim/rhwp/commit/${{ needs.resolve.outputs.sha }}
          license: MIT (LICENSE)
          build: cargo build --locked --release --bin rhwp --target ${{ matrix.target }}
          features: default (native-skia 없음 — PNG 렌더 제외, PDF 는 SVG backend)
          runner: ${{ matrix.runner }}${{ matrix.docker && format(' (container {0})', matrix.docker) || '' }}
          workflow: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EOF
          if [[ "${{ matrix.archive }}" == "zip" ]]; then
            (cd dist && 7z a -tzip "../$ARCHIVE" rhwp >/dev/null)
          else
            (cd dist && tar -czf "../$ARCHIVE" rhwp)
          fi
          ls -la "$ARCHIVE"

      # 압축 파일을 새 폴더에 풀어 hwp-master 가 쓰는 읽기·추출·PDF 경로를 실제로 돌려 본다.
      - name: Write verify script
        shell: bash
        run: |
          cat > .ci-verify.py <<'EOF'
          import json, os, subprocess, sys, tarfile, tempfile, zipfile
          from pathlib import Path

          archive, sample = sys.argv[1], sys.argv[2]
          work = Path(tempfile.mkdtemp())
          if archive.endswith(".zip"):
              zipfile.ZipFile(archive).extractall(work)
          else:
              with tarfile.open(archive) as t:
                  t.extractall(work, **({"filter": "data"} if hasattr(tarfile, "data_filter") else {}))
          exe = work / "rhwp" / ("rhwp.exe" if os.name == "nt" else "rhwp")
          exe.chmod(0o755)

          def run(*args):
              p = subprocess.run([str(exe), *args], capture_output=True, text=True, encoding="utf-8",
                                 errors="replace", timeout=600)
              if p.returncode != 0:
                  sys.exit(f"rhwp {' '.join(args)} 실패 (exit {p.returncode}): {p.stderr[-1500:]}")
              return p.stdout

          print(run("--version").strip())
          pages = json.loads(run("export-text", sample, "--json"))["pages"]
          assert pages and any(p["text"].strip() for p in pages), "본문 텍스트가 비었다"
          tables = json.loads(run("export-tables", sample, "--json"))
          structure = json.loads(run("export-structure", sample, "--json"))
          data = json.loads(run("extract-data", sample, "--json"))
          pdf = work / "out.pdf"
          run("export-pdf", sample, "-o", str(pdf))
          assert pdf.read_bytes()[:4] == b"%PDF", "PDF 가 아니다"
          hwpx = work / "round.hwpx"
          run("export-hwpx", sample, str(hwpx))
          assert zipfile.is_zipfile(hwpx), "HWPX 저장 실패"
          print(f"ok: pages {len(pages)}, tables {tables.get('tableCount')}, outline {structure.get('nodeCount')}, "
                f"data {data.get('itemCount')}, pdf {pdf.stat().st_size} bytes")
          EOF

      - name: Set up Python
        if: ${{ !matrix.docker }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Verify packaged binary
        if: ${{ !matrix.docker }}
        shell: bash
        run: python .ci-verify.py "$ARCHIVE" samples/issue2527_empty_linesegs.hwpx

      # 오래된 glibc 에서 실제로 도는지는 빌드 도구 없는 그 컨테이너 안에서 확인한다.
      - name: Verify packaged binary in container
        if: ${{ matrix.docker }}
        shell: bash
        run: |
          docker run --rm -v "$PWD":/src -w /src "${{ matrix.docker }}" bash -euo pipefail -c '
            ldd --version | sed -n 1p
            python3.12 .ci-verify.py "$0" samples/issue2527_empty_linesegs.hwpx
          ' "$ARCHIVE"

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.ARCHIVE }}
          path: ${{ env.ARCHIVE }}
          retention-days: 7

  release:
    name: Publish release
    needs: [resolve, build]
    if: github.event_name == 'schedule' || inputs.publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist/
          merge-multiple: true

      - name: Checksums
        run: |
          cd dist
          sha256sum *.tar.gz *.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: rhwp-${{ needs.build.outputs.version }}-${{ needs.build.outputs.short }}
        run: |
          cat > notes.md <<EOF
          hwp-master 용 rhwp CLI 바이너리 (MIT, upstream 그대로 빌드).
          네트워크·시스템 비용을 줄이려고, AI 에이전트가 rhwp 소스 저장소(수 GB)를 받아 빌드하지 않고 이 바이너리만 받아 쓰게 올린다.

          - 원본: https://github.com/edwardkim/rhwp/commit/${{ needs.resolve.outputs.sha }} (요청: ${{ inputs.rhwp_ref || 'devel' }})
          - 기능: 기본 (읽기·쓰기·편집·추출·PDF 미리보기). native-skia(PNG 렌더)는 넣지 않았다
          - 빌드: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          - 설치: \`python3 skills/hwp-master/scripts/install_rhwp.py\` (SHA256SUMS.txt 로 검증)
          EOF
          gh release create "$TAG" dist/* --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" --title "$TAG" --notes-file notes.md --latest

  # 새 Release(또는 이미 있는 Release)를 rhwp_release.json·README 에 반영하고, 그 바이너리를 설치해
  # 테스트한 뒤 main 으로 PR 을 열어 머지한다. 테스트가 실패하면 아무것도 올리지 않는다.
  update:
    name: Update pinned release
    needs: [resolve, build, release]
    if: >-
      !cancelled() && needs.resolve.result == 'success'
      && (needs.release.result == 'success' || needs.resolve.outputs.existing_tag != '')
      && (github.event_name == 'schedule' || inputs.update)
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.resolve.outputs.existing_tag || format('rhwp-{0}-{1}', needs.build.outputs.version, needs.build.outputs.short) }}
      RHWP_SHA: ${{ needs.resolve.outputs.sha }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Apply release to rhwp_release.json and README
        id: apply
        shell: bash
        run: |
          old=$(python3 -c "import json; print(json.load(open('skills/hwp-master/rhwp_release.json'))['tag'])")
          echo "old=$old" >> "$GITHUB_OUTPUT"
          if [[ "$old" == "$TAG" ]]; then
            echo "::notice::main 이 이미 $TAG 를 씁니다. 할 일이 없습니다."
            echo "main 이 이미 \`$TAG\` 를 씁니다." >> "$GITHUB_STEP_SUMMARY"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python3 tools/update_rhwp_release.py --tag "$TAG"
          git diff --stat
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Install the new binary
        if: steps.apply.outputs.changed == 'true'
        shell: bash
        run: |
          python3 skills/hwp-master/scripts/install_rhwp.py
          python3 skills/hwp-master/scripts/rhwp_locate.py

      - name: Run tests
        if: steps.apply.outputs.changed == 'true'
        shell: bash
        run: python3 -m unittest discover -s tests

      - name: Evaluate extraction quality
        if: steps.apply.outputs.changed == 'true'
        shell: bash
        run: python3 tools/eval_extract.py

      - name: Commit, open PR and merge
        if: steps.apply.outputs.changed == 'true'
        shell: bash
        env:
          OLD_TAG: ${{ steps.apply.outputs.old }}
        run: |
          short="${RHWP_SHA:0:7}"
          git fetch origin main devel
          # devel 이 main 과 같을 때만 devel 로 올린다. 다르면 진행 중인 작업이 함께 머지되지 않게 따로 올린다.
          if [[ "$(git rev-parse origin/devel)" == "$(git rev-parse origin/main)" ]]; then
            branch=devel
          else
            branch="auto/rhwp-$short"
            echo "::notice::devel 이 main 과 달라 $branch 브랜치로 올립니다."
          fi
          title="chore(rhwp): 배포 바이너리를 rhwp devel $short($TAG)로 올림"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add skills/hwp-master/rhwp_release.json README.md
          git commit -m "$title" -m "- rhwp_release.json: 태그·커밋·SHA-256 을 Release $TAG 로 ($OLD_TAG 다음)
          - README: 태그·날짜
          - 자동 반영: $RUN_URL"
          git push origin "HEAD:refs/heads/$branch"

          cat > "$RUNNER_TEMP/pr.md" <<EOF
          ## 요약
          배포 rhwp 바이너리를 Release **\`$TAG\`** (edwardkim/rhwp@$RHWP_SHA) 로 올립니다. 이전: \`$OLD_TAG\`.
          예약 실행이 자동으로 만든 PR 입니다.

          - 실행: $RUN_URL
          - \`tools/update_rhwp_release.py\` 로 \`skills/hwp-master/rhwp_release.json\`(태그·커밋·SHA-256)과 README 의 태그·날짜를 바꿨습니다.

          ## 확인 (GitHub Actions ubuntu-latest, 새 바이너리 \`install_rhwp.py\` 설치·SHA-256 확인)
          - \`python3 -m unittest discover -s tests\`: 통과
          - \`python3 tools/eval_extract.py\`: exit 0

          ## 하지 않은 확인
          - macOS·Windows 에서의 hwp-master 테스트, 실문서 말뭉치(\`EXTRACT_CORPUS\`) 평가
          EOF
          url=$(gh pr list --base main --head "$branch" --state open --json url --jq '.[0].url // empty')
          if [[ -z "$url" ]]; then
            url=$(gh pr create --base main --head "$branch" --title "$title" --body-file "$RUNNER_TEMP/pr.md")
          fi
          echo "PR: $url"
          echo "### $TAG → $url" >> "$GITHUB_STEP_SUMMARY"

          # 막 만든 PR 은 머지 가능 여부 계산이 끝나지 않았을 수 있다.
          merged=false
          for i in 1 2 3 4 5 6; do
            if gh pr merge "$url" --merge; then merged=true; break; fi
            sleep 10
          done
          $merged || { echo "PR 을 머지하지 못했습니다: $url" >&2; exit 1; }

          if [[ "$branch" == "devel" ]]; then
            git fetch origin main
            git push origin "origin/main:refs/heads/devel"
          else
            git push origin --delete "$branch"
          fi
